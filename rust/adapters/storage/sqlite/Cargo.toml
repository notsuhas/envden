[package]
name = "envden-adapter-storage-sqlite"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
envden-core = { path = "../../../core" }
parking_lot = "0.12"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
rusqlite = { version = "0.38", features = ["bundled", "serialize"] }

[dev-dependencies]
envden-testing = { path = "../../../testing" }
tempfile = "3"
serde_json = "1"
