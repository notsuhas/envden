[workspace]
resolver = "3"
members = ["rust/core", "rust/protocol", "rust/testing"]
exclude = ["rust/vendor"]

[workspace.package]
version = "0.3.8"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[workspace.dependencies]
thiserror = "2"

[patch.crates-io]
# exposes fixed-ephemeral encapsulation; see rust/vendor/hpke/ENVDEN-PATCH.md
hpke = { path = "rust/vendor/hpke" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
