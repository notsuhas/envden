name: Go

on:
  push:
    branches: [port/go]
  pull_request:
    paths: ["go/**", "packaging/**", ".parity-reference", ".github/workflows/go.yml"]

permissions:
  contents: read

concurrency:
  group: go-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: go

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: go
      # platform-specific files only compile, and so only lint, under their own GOOS
      - name: golangci-lint (darwin and windows builds)
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          for os in darwin windows; do GOOS=$os "$(go env GOPATH)/bin/golangci-lint" run ./...; done

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - if: runner.os == 'Linux'
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      # the sync exploration traces run in their own job below; -race doubles macOS time, so Linux alone runs it
      - run: go test ${{ runner.os == 'Linux' && '-race' || '' }} -timeout 12m -skip '^TestExploration$' ./...

  exploration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: go test -timeout 12m -run '^TestExploration$' ./cli/sync/enginetest

  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: ./scripts/build-all.sh
      - run: ls -l dist
      # builds only; signing and publishing follow docs/releasing.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: envden-go
          path: go/dist/
          retention-days: 7

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: ./scripts/build-all.sh linux-x64-musl
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          build-contexts: release-artifacts=./go/dist
          platforms: linux/amd64
          push: false
          load: true
          tags: envden:ci
      - name: Smoke hardened container
        working-directory: .
        run: |
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp:uid=10001,gid=10001,mode=1777 --tmpfs /var/run/tailscale:uid=10001,gid=10001,mode=0700 --entrypoint envden envden:ci --version

  # the reference build and harness live on main, pinned by .parity-reference; mixed setups run on Linux only
  parity:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, shard: 1/6 }
          - { os: ubuntu-24.04, shard: 2/6 }
          - { os: ubuntu-24.04, shard: 3/6 }
          - { os: ubuntu-24.04, shard: 4/6 }
          - { os: ubuntu-24.04, shard: 5/6 }
          - { os: ubuntu-24.04, shard: 6/6 }
          - { os: macos-15, shard: 1/4 }
          - { os: macos-15, shard: 2/4 }
          - { os: macos-15, shard: 3/4 }
          - { os: macos-15, shard: 4/4 }
    name: parity (${{ matrix.os }}, ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: reference
        working-directory: .
        run: echo "sha=$(tr -d '[:space:]' < .parity-reference)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.reference.outputs.sha }}
          path: reference
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: reference/package.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Build the reference
        working-directory: reference/apps/cli
        run: bun install --frozen-lockfile && bun run build
      - run: go build -o dist/envden ./cmd/envden && echo "CANDIDATE=$PWD/dist/envden" >> "$GITHUB_ENV"
      - working-directory: reference
        run: bash parity/ci/install-stand-ins.sh
      - name: Parity suite
        working-directory: reference
        run: bun parity/run.ts --reference apps/cli/dist/envden --candidate "$CANDIDATE" --shard ${{ matrix.shard }} ${{ runner.os == 'Linux' && '--mix' || '' }}
      - name: Transport
        if: startsWith(matrix.shard, '1/') && (success() || failure())
        working-directory: reference
        run: bun parity/transport.ts --reference apps/cli/dist/envden --candidate "$CANDIDATE" --mode semantic
      - name: e2e against the Go binary
        if: startsWith(matrix.shard, '1/') && (success() || failure())
        working-directory: reference
        run: bun apps/cli/scripts/e2e.ts "$CANDIDATE"

  host-here:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: reference
        working-directory: .
        run: echo "sha=$(tr -d '[:space:]' < .parity-reference)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.reference.outputs.sha }}
          path: reference
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: reference/package.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Build the reference
        working-directory: reference/apps/cli
        run: bun install --frozen-lockfile && bun run build
      - run: go build -o dist/envden ./cmd/envden && echo "CANDIDATE=$PWD/dist/envden" >> "$GITHUB_ENV"
      - working-directory: reference
        run: PARITY_HOST_SHIMS=1 bash parity/ci/install-stand-ins.sh
      - working-directory: reference
        run: PARITY_HOST_SHIMS=1 bun parity/run.ts --reference apps/cli/dist/envden --candidate "$CANDIDATE" --scenario host-here
