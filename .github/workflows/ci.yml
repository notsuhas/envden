name: CI

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      binary: ${{ steps.paths.outputs.binary }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun scripts/ci/changes.ts "$BASE" "$GITHUB_SHA"

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run fallow --fail-on-issues
      - run: bun test apps/web scripts

  test:
    needs: changes
    if: needs.changes.outputs.binary == 'true'
    strategy:
      fail-fast: false
      matrix:
        # windows-2025 is off for now: its run passes the 20-minute limit; macOS takes 2 shards to stay within 5 macOS runners
        include:
          - { os: ubuntu-24.04, shard: 1/4 }
          - { os: ubuntu-24.04, shard: 2/4 }
          - { os: ubuntu-24.04, shard: 3/4 }
          - { os: ubuntu-24.04, shard: 4/4 }
          - { os: macos-15, shard: 1/2 }
          - { os: macos-15, shard: 2/2 }
    name: test (${{ matrix.os }}, ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - run: bun test --shard ${{ matrix.shard }} --timeout ${{ runner.os == 'Windows' && '30000' || '15000' }}

  compile:
    needs: changes
    if: needs.changes.outputs.binary == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-x64, asset: envden-linux-x64 }
          - { os: macos-15, target: darwin-arm64, asset: envden-darwin-arm64 }
          - { os: windows-2025, target: windows-x64, asset: envden-windows-x64.exe }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun apps/cli/scripts/build-all.ts ${{ matrix.target }}
      - run: bun apps/cli/scripts/smoke.ts apps/cli/dist/${{ matrix.asset }}
      # setup requires tailnet HTTPS certificates, so a stand-in tailscale reports them enabled
      - if: runner.os != 'Windows'
        run: |
          cat > "$RUNNER_TEMP/tailscale" <<'EOF'
          #!/bin/sh
          echo '{"BackendState":"Running","Self":{"DNSName":"ci.example.ts.net."},"CertDomains":["ci.example.ts.net"]}'
          EOF
          bin=/usr/local/bin; [ "$RUNNER_OS" = Linux ] && bin=/usr/bin
          sudo install -m 0755 "$RUNNER_TEMP/tailscale" "$bin/tailscale"
      # Bun's pseudo-terminal support is POSIX-only, so Windows runs the smoke test alone
      - if: runner.os != 'Windows'
        run: bun apps/cli/scripts/e2e.ts apps/cli/dist/${{ matrix.asset }}

  parity:
    needs: changes
    if: needs.changes.outputs.binary == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, shard: 1/2 }
          - { os: ubuntu-24.04, shard: 2/2 }
          - { os: macos-15, shard: 1/2 }
          - { os: macos-15, shard: 2/2 }
    name: parity (${{ matrix.os }}, ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
        working-directory: apps/cli
      # a second copy so the harness compares two distinct executables
      - run: cp apps/cli/dist/envden "$RUNNER_TEMP/envden"
      - run: bash parity/ci/install-stand-ins.sh
      - run: bun parity/run.ts --reference apps/cli/dist/envden --candidate "$RUNNER_TEMP/envden" --shard ${{ matrix.shard }}
      - if: startsWith(matrix.shard, '1/') && (success() || failure())
        run: bun parity/transport.ts --reference apps/cli/dist/envden --candidate "$RUNNER_TEMP/envden" --mode semantic
      - if: startsWith(matrix.shard, '1/') && (success() || failure())
        run: bun parity/verify.ts apps/cli/dist/envden
      # host shims replace service tools, so host-here runs last and only on Linux
      - if: runner.os == 'Linux' && startsWith(matrix.shard, '1/') && (success() || failure())
        env:
          PARITY_HOST_SHIMS: "1"
        run: |
          bash parity/ci/install-stand-ins.sh
          bun parity/run.ts --reference apps/cli/dist/envden --candidate "$RUNNER_TEMP/envden" --scenario host-here

  container:
    needs: changes
    if: needs.changes.outputs.binary == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun apps/cli/scripts/build-all.ts linux-x64-musl
      - name: Smoke musl on Alpine
        run: |
          docker run --rm -v "$PWD/apps/cli/dist:/dist:ro" -e ENVDEN_HOME=/tmp/envden -e ENVDEN_NO_UPDATE_CHECK=1 -e ENVDEN_TELEMETRY=0 alpine:3.22@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f sh -ec 'apk add --no-cache libstdc++=14.2.0-r6; for args in "--version" "--help" "doctor --json"; do /dist/envden-linux-x64-musl $args; done'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/server/Dockerfile
          build-contexts: release-artifacts=./apps/cli/dist
          platforms: linux/amd64
          push: false
          load: true
          tags: envden:ci
      - name: Smoke hardened container
        run: |
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp:uid=10001,gid=10001,mode=1777 --tmpfs /var/run/tailscale:uid=10001,gid=10001,mode=0700 --entrypoint envden envden:ci --version
