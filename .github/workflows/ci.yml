name: CI

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run fallow --fail-on-issues

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - run: bun test --timeout ${{ runner.os == 'Windows' && '30000' || '5000' }}

  compile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-x64, asset: envden-linux-x64 }
          - { os: macos-15, target: darwin-arm64, asset: envden-darwin-arm64 }
          - { os: windows-2025, target: windows-x64, asset: envden-windows-x64.exe }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun apps/cli/scripts/build-all.ts ${{ matrix.target }}
      - run: bun apps/cli/scripts/smoke.ts apps/cli/dist/${{ matrix.asset }}
      # setup requires tailnet HTTPS certificates, so a stand-in tailscale reports them enabled
      - if: runner.os != 'Windows'
        run: |
          cat > "$RUNNER_TEMP/tailscale" <<'EOF'
          #!/bin/sh
          echo '{"BackendState":"Running","Self":{"DNSName":"ci.example.ts.net."},"CertDomains":["ci.example.ts.net"]}'
          EOF
          bin=/usr/local/bin; [ "$RUNNER_OS" = Linux ] && bin=/usr/bin
          sudo install -m 0755 "$RUNNER_TEMP/tailscale" "$bin/tailscale"
      # Bun's pseudo-terminal support is POSIX-only, so Windows runs the smoke test alone
      - if: runner.os != 'Windows'
        run: bun apps/cli/scripts/e2e.ts apps/cli/dist/${{ matrix.asset }}
