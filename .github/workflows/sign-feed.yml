name: Sign and publish feed
on:
  workflow_call:
    inputs:
      tag_release:
        type: boolean
        required: true
      first_release:
        type: boolean
        default: false
jobs:
  feed:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.tag_release && 'release' || 'release-resign' }}
    concurrency:
      group: release-feed-publish
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.tag_release
        with:
          pattern: binaries-*
          merge-multiple: true
          path: release
      - name: Load published release assets and generation feeds
        env:
          FIRST_RELEASE: ${{ inputs.first_release && '1' || '0' }}
          TAG_RELEASE: ${{ inputs.tag_release }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release previous
          generation=$(bun --tsconfig-override scripts/tsconfig.json -e 'import { releaseConfig } from "@envden/cli/src/updates/release-config.ts"; console.log(releaseConfig.trust.generation)')
          if tag=$(gh release view --json tagName --jq .tagName); then
            gh release download "$tag" -p 'release-g*.bin' -D previous
            for ((g=1; g<generation; g++)); do
              test -f "previous/release-g$g.bin"
              cp "previous/release-g$g.bin" release/
            done
            if [ "$TAG_RELEASE" != true ]; then
              gh release download "$tag" -p 'envden-*' -D release
              echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
            fi
          else
            test "$FIRST_RELEASE" = 1
            test "$TAG_RELEASE" = true
          fi
          echo "ENVDEN_FIRST_RELEASE=$FIRST_RELEASE" >> "$GITHUB_ENV"
          if [ "$TAG_RELEASE" = true ]; then echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"; fi
      - name: Hash and sign
        env:
          ENVDEN_RELEASE_PRIMARY_SEED_HEX: ${{ secrets.ENVDEN_RELEASE_PRIMARY_SEED_HEX }}
          ENVDEN_UNSAFE_VERSIONS: ${{ vars.ENVDEN_UNSAFE_VERSIONS }}
        run: |
          export ENVDEN_RELEASE_VERSION="${RELEASE_TAG#v}"
          bun --tsconfig-override scripts/tsconfig.json scripts/release/checksums.ts release
          bun --tsconfig-override scripts/tsconfig.json scripts/release/sign.ts release
      - name: Publish new release
        if: inputs.tag_release
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --generate-notes
      - name: Refresh signed feed
        if: ${{ !inputs.tag_release }}
        run: gh release upload "$RELEASE_TAG" release/release*.bin --clobber
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.tag_release
        with:
          name: release-checksums
          path: release/SHA256SUMS
          if-no-files-found: error
