name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun scripts/release/check-tag.ts
  build:
    needs: validate
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15-intel, targets: darwin-x64, smoke: envden-darwin-x64 }
          - { os: macos-15, targets: darwin-arm64, smoke: envden-darwin-arm64 }
          - { os: ubuntu-24.04, targets: linux-x64, smoke: envden-linux-x64 }
          - { os: ubuntu-24.04-arm, targets: linux-arm64, smoke: envden-linux-arm64 }
          - { os: ubuntu-24.04, targets: linux-x64-musl, smoke: envden-linux-x64-musl }
          - { os: ubuntu-24.04-arm, targets: linux-arm64-musl, smoke: envden-linux-arm64-musl }
          - { os: windows-2025, targets: windows-x64, smoke: envden-windows-x64.exe }
          - { os: windows-11-arm, targets: windows-arm64, smoke: envden-windows-arm64.exe }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun apps/cli/scripts/build-all.ts ${{ matrix.targets }}
        env:
          ENVDEN_TELEMETRY_KEY: ${{ vars.ENVDEN_TELEMETRY_KEY }}
      - if: ${{ !contains(matrix.targets, 'musl') }}
        run: bun apps/cli/scripts/smoke.ts apps/cli/dist/${{ matrix.smoke }}
      - name: Smoke musl on Alpine
        if: contains(matrix.targets, 'musl')
        run: |
          docker run --rm -v "$PWD/apps/cli/dist:/dist:ro" -e ENVDEN_HOME=/tmp/envden -e ENVDEN_NO_UPDATE_CHECK=1 -e ENVDEN_TELEMETRY=0 alpine:3.22@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f sh -ec 'apk add --no-cache libstdc++=14.2.0-r6; for args in "--version" "--help" "doctor --json"; do /dist/${{ matrix.smoke }} $args; done'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          overwrite: true
          name: binaries-${{ matrix.targets }}
          path: apps/cli/dist/envden-*
          if-no-files-found: error
  image:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Require image namespace
        env:
          NAMESPACE: ${{ vars.ENVDEN_GHCR_NAMESPACE }}
        run: test -n "$NAMESPACE" && ! echo "$NAMESPACE" | grep -qi REPLACE
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: binaries-linux-*-musl
          merge-multiple: true
          path: release
      - id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/server/Dockerfile
          build-contexts: release-artifacts=./release
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=ghcr.io/${{ vars.ENVDEN_GHCR_NAMESPACE }}/envden,push-by-digest=true,name-canonical=true,push=true
  publish:
    if: github.event_name == 'push'
    needs: [build, image]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    environment: release
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: release
      - name: Hash release builds
        run: bun --tsconfig-override scripts/tsconfig.json scripts/release/checksums.ts release
      - name: Check current release
        id: current
        run: bun scripts/release/current-release.ts
      - name: Publish release
        env:
          HIGHEST: ${{ steps.current.outputs.highest }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          if ! [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then echo "Invalid image digest" >&2; exit 1; fi
          printf '%s\n' "$IMAGE_DIGEST" > release/IMAGE_DIGEST
          bun scripts/release/publication/run.ts
  promote-image:
    if: github.event_name == 'push'
    needs: [publish, image]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - id: current
        run: bun scripts/release/current-release.ts
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote release image
        env:
          IMAGE: ghcr.io/${{ vars.ENVDEN_GHCR_NAMESPACE }}/envden
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern IMAGE_DIGEST --pattern SHA256SUMS --dir published
          DIGEST=$(cat published/IMAGE_DIGEST)
          if ! [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then echo "Invalid published image digest" >&2; exit 1; fi
          version=${GITHUB_REF_NAME#v}
          tags=(-t "$IMAGE:$version")
          if [ "${{ steps.current.outputs.highest }}" = true ]; then
            tags+=(-t "$IMAGE:${version%.*}" -t "$IMAGE:${version%%.*}" -t "$IMAGE:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE@$DIGEST"

  npm:
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Download published checksums
        run: gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS --dir npm-release
      - id: current
        run: bun scripts/release/current-release.ts
      - name: Build the npm package from the release checksums
        run: |
          bun --tsconfig-override scripts/tsconfig.json scripts/release/npm-package.ts "${GITHUB_REF_NAME#v}" npm-release/SHA256SUMS npm-release/package
      # trusted publishing: npm exchanges the GitHub OIDC token, so no NPM_TOKEN secret
      - name: Publish npm unless this version already exists
        run: |
          version=${GITHUB_REF_NAME#v}
          if npm view "envden@$version" version --json >version.json 2>npm-error; then
            node -e 'if (JSON.parse(require("fs").readFileSync("version.json", "utf8")) !== process.argv[1]) process.exit(1)' "$version"
            mkdir npm-published
            npm pack "envden@$version" --pack-destination npm-published
            tar -xzf "npm-published/envden-$version.tgz" -C npm-published package/checksums.json
            bun scripts/release/publication/npm.ts npm-published/package/checksums.json npm-release/SHA256SUMS
          elif grep -q 'E404' npm-error; then
            tag=backport
            if [ "${{ steps.current.outputs.highest }}" = true ]; then tag=latest; fi
            npx -y npm@11.21.2 publish ./npm-release/package --access public --tag "$tag"
          else
            cat npm-error >&2
            exit 1
          fi

  homebrew:
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - id: current
        run: bun scripts/release/current-release.ts
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: steps.current.outputs.highest == 'true'
        with:
          repository: notsuhas/homebrew-tap
          ssh-key: ${{ secrets.ENVDEN_HOMEBREW_TAP_KEY }}
          path: homebrew-tap
      - name: Download published checksums
        if: steps.current.outputs.highest == 'true'
        run: gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS --dir homebrew-release
      - name: Render the formula from the release checksums
        if: steps.current.outputs.highest == 'true'
        run: |
          bun --tsconfig-override scripts/tsconfig.json scripts/release/homebrew-formula.ts "${GITHUB_REF_NAME#v}" homebrew-release/SHA256SUMS homebrew-tap/Formula/envden.rb
      - name: Push the formula
        if: steps.current.outputs.highest == 'true'
        working-directory: homebrew-tap
        run: |
          git add Formula/envden.rb
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "envden ${GITHUB_REF_NAME#v}"
          git push origin HEAD

  scoop:
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - id: current
        run: bun scripts/release/current-release.ts
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: steps.current.outputs.highest == 'true'
        with:
          repository: notsuhas/scoop-bucket
          ssh-key: ${{ secrets.ENVDEN_SCOOP_BUCKET_KEY }}
          path: scoop-bucket
      - name: Download published checksums
        if: steps.current.outputs.highest == 'true'
        run: gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS --dir scoop-release
      - name: Render the manifest from the release checksums
        if: steps.current.outputs.highest == 'true'
        run: |
          bun --tsconfig-override scripts/tsconfig.json scripts/release/scoop-manifest.ts "${GITHUB_REF_NAME#v}" scoop-release/SHA256SUMS scoop-bucket/bucket/envden.json
      - name: Push the manifest
        if: steps.current.outputs.highest == 'true'
        working-directory: scoop-bucket
        run: |
          git add bucket/envden.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "envden ${GITHUB_REF_NAME#v}"
          git push origin HEAD
