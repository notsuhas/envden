name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun scripts/release/check-tag.ts
  build:
    needs: validate
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15-intel, targets: darwin-x64, smoke: envden-darwin-x64 }
          - { os: macos-15, targets: darwin-arm64, smoke: envden-darwin-arm64 }
          - { os: ubuntu-24.04, targets: linux-x64, smoke: envden-linux-x64 }
          - { os: ubuntu-24.04-arm, targets: linux-arm64, smoke: envden-linux-arm64 }
          - { os: ubuntu-24.04, targets: linux-x64-musl, smoke: envden-linux-x64-musl }
          - { os: ubuntu-24.04-arm, targets: linux-arm64-musl, smoke: envden-linux-arm64-musl }
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ startsWith(matrix.targets, 'darwin-') && 60 || 25 }}
    env:
      MACOS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
      BINARY: apps/cli/dist/${{ matrix.smoke }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun apps/cli/scripts/build-all.ts ${{ matrix.targets }}
        env:
          ENVDEN_TELEMETRY_KEY: ${{ vars.ENVDEN_TELEMETRY_KEY }}
      - name: Skip macOS signing
        if: runner.os == 'macOS' && env.MACOS_SIGNING != 'true'
        run: echo "::notice::MACOS_CERTIFICATE_P12 is not set, so $BINARY stays ad-hoc signed and is not notarized."
      - name: Import the Developer ID certificate
        if: runner.os == 'macOS' && env.MACOS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/envden-signing.keychain-db"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          password=$(openssl rand -base64 32)
          echo "::add-mask::$password"
          security list-keychains -d user > "$RUNNER_TEMP/keychains-before"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -f pkcs12 -P "$MACOS_CERTIFICATE_PASSWORD" -A
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          xargs security list-keychains -d user -s "$keychain" < "$RUNNER_TEMP/keychains-before"
          identity=$(security find-identity -p codesigning "$keychain" | awk '/"Developer ID Application: /{ print $2; exit }')
          if [ -z "$identity" ]; then echo "::error::No Developer ID Application identity in MACOS_CERTIFICATE_P12"; exit 1; fi
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Sign the macOS binary
        if: runner.os == 'macOS' && env.MACOS_SIGNING == 'true'
        run: |
          codesign --force --options runtime --timestamp --entitlements packaging/macos/entitlements.plist --identifier dev.envden.cli --keychain "$SIGNING_KEYCHAIN" --sign "$SIGNING_IDENTITY" "$BINARY"
          codesign --verify --strict --verbose=2 "$BINARY"
          codesign --display --verbose=2 "$BINARY"
          "$BINARY" version
      - name: Notarize the macOS binary
        if: runner.os == 'macOS' && env.MACOS_SIGNING == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          for name in APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            if [ -z "${!name}" ]; then echo "::error::$name is required when MACOS_CERTIFICATE_P12 is set"; exit 1; fi
          done
          key="$RUNNER_TEMP/notary-key.p8"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$key"
          auth=(--key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID")
          archive="$RUNNER_TEMP/${{ matrix.smoke }}.zip"
          ditto -c -k --keepParent "$BINARY" "$archive"
          xcrun notarytool submit "$archive" "${auth[@]}" --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notary.json" || true
          if ! id=$(plutil -extract id raw -o - "$RUNNER_TEMP/notary.json"); then cat "$RUNNER_TEMP/notary.json"; exit 1; fi
          status=$(plutil -extract status raw -o - "$RUNNER_TEMP/notary.json")
          echo "Notarization $id: $status"
          if [ "$status" != Accepted ]; then
            xcrun notarytool log "$id" "${auth[@]}"
            exit 1
          fi
          rm -f "$key" "$archive"
          # spctl rejects every bare CLI tool as "not an app", so check the online ticket directly.
          codesign --verify --strict --verbose=2 -R=notarized --check-notarization "$BINARY"
      - name: Remove the signing keychain
        if: always() && runner.os == 'macOS' && env.MACOS_SIGNING == 'true'
        run: |
          if [ -f "$RUNNER_TEMP/keychains-before" ]; then xargs security list-keychains -d user -s < "$RUNNER_TEMP/keychains-before"; fi
          if [ -n "$SIGNING_KEYCHAIN" ]; then security delete-keychain "$SIGNING_KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/notary-key.p8"
      - if: ${{ !contains(matrix.targets, 'musl') }}
        run: bun apps/cli/scripts/smoke.ts apps/cli/dist/${{ matrix.smoke }}
      - name: Smoke musl on Alpine
        if: contains(matrix.targets, 'musl')
        run: |
          docker run --rm -v "$PWD/apps/cli/dist:/dist:ro" -e ENVDEN_HOME=/tmp/envden -e ENVDEN_NO_UPDATE_CHECK=1 -e ENVDEN_TELEMETRY=0 alpine:3.22@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f sh -ec 'apk add --no-cache libstdc++=14.2.0-r6; for args in "--version" "--help" "doctor --json"; do /dist/${{ matrix.smoke }} $args; done'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          overwrite: true
          name: binaries-${{ matrix.targets }}
          path: apps/cli/dist/envden-*
          if-no-files-found: error
  image:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Require image namespace
        env:
          NAMESPACE: ${{ vars.ENVDEN_GHCR_NAMESPACE }}
        run: test -n "$NAMESPACE" && ! echo "$NAMESPACE" | grep -qi REPLACE
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: binaries-linux-*-musl
          merge-multiple: true
          path: release
      - id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/server/Dockerfile
          build-contexts: release-artifacts=./release
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=ghcr.io/${{ vars.ENVDEN_GHCR_NAMESPACE }}/envden,push-by-digest=true,name-canonical=true,push=true
  publish:
    if: github.event_name == 'push'
    needs: [build, image]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    environment: release
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: release
      - name: Hash release builds
        run: bun --tsconfig-override scripts/tsconfig.json scripts/release/checksums.ts release
      - name: Check current release
        id: current
        run: bun scripts/release/current-release.ts
      - name: Publish release
        env:
          HIGHEST: ${{ steps.current.outputs.highest }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          MACOS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
        run: |
          if ! [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then echo "Invalid image digest" >&2; exit 1; fi
          printf '%s\n' "$IMAGE_DIGEST" > release/IMAGE_DIGEST
          bun scripts/release/publication/run.ts
  promote-image:
    if: github.event_name == 'push'
    needs: [publish, image]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - id: current
        run: bun scripts/release/current-release.ts
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote release image
        env:
          IMAGE: ghcr.io/${{ vars.ENVDEN_GHCR_NAMESPACE }}/envden
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern IMAGE_DIGEST --pattern SHA256SUMS --dir published
          DIGEST=$(cat published/IMAGE_DIGEST)
          if ! [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then echo "Invalid published image digest" >&2; exit 1; fi
          version=${GITHUB_REF_NAME#v}
          tags=(-t "$IMAGE:$version")
          if [ "${{ steps.current.outputs.highest }}" = true ]; then
            tags+=(-t "$IMAGE:${version%.*}" -t "$IMAGE:${version%%.*}" -t "$IMAGE:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE@$DIGEST"

  homebrew:
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - id: current
        run: bun scripts/release/current-release.ts
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: steps.current.outputs.highest == 'true'
        with:
          repository: notsuhas/homebrew-tap
          ssh-key: ${{ secrets.ENVDEN_HOMEBREW_TAP_KEY }}
          path: homebrew-tap
      - name: Download published checksums
        if: steps.current.outputs.highest == 'true'
        run: gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS --dir homebrew-release
      - name: Render the formula from the release checksums
        if: steps.current.outputs.highest == 'true'
        run: |
          bun --tsconfig-override scripts/tsconfig.json scripts/release/homebrew-formula.ts "${GITHUB_REF_NAME#v}" homebrew-release/SHA256SUMS homebrew-tap/Formula/envden.rb
      - name: Push the formula
        if: steps.current.outputs.highest == 'true'
        working-directory: homebrew-tap
        run: |
          git add Formula/envden.rb
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "envden ${GITHUB_REF_NAME#v}"
          git push origin HEAD
