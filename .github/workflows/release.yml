name: Release
on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: release-${{ github.event_name == 'push' && github.ref || 'resign' }}
  cancel-in-progress: false
  queue: max
jobs:
  build:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15-intel, targets: darwin-x64, smoke: envden-darwin-x64 }
          - { os: macos-15, targets: darwin-arm64, smoke: envden-darwin-arm64 }
          - { os: ubuntu-24.04, targets: linux-x64, smoke: envden-linux-x64 }
          - { os: ubuntu-24.04-arm, targets: linux-arm64, smoke: envden-linux-arm64 }
          - { os: ubuntu-24.04, targets: linux-x64-musl, smoke: envden-linux-x64-musl }
          - { os: ubuntu-24.04-arm, targets: linux-arm64-musl, smoke: envden-linux-arm64-musl }
          - { os: windows-2025, targets: windows-x64, smoke: envden-windows-x64.exe }
          - { os: windows-11-arm, targets: windows-arm64, smoke: envden-windows-arm64.exe }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Check tag version
        shell: bash
        run: bun -e 'if ("v" + (await Bun.file("apps/cli/package.json").json()).version !== process.env.GITHUB_REF_NAME || "v" + (await Bun.file("apps/server/package.json").json()).version !== process.env.GITHUB_REF_NAME) throw new Error("Tag/version mismatch")'
      - run: bun apps/cli/scripts/build-all.ts ${{ matrix.targets }}
        env:
          ENVDEN_TELEMETRY_KEY: ${{ vars.ENVDEN_TELEMETRY_KEY }}
      - if: ${{ !contains(matrix.targets, 'musl') }}
        run: bun apps/cli/scripts/smoke.ts apps/cli/dist/${{ matrix.smoke }}
      - name: Smoke musl on Alpine
        if: contains(matrix.targets, 'musl')
        run: |
          docker run --rm -v "$PWD/apps/cli/dist:/dist:ro" -e ENVDEN_HOME=/tmp/envden -e ENVDEN_NO_UPDATE_CHECK=1 -e ENVDEN_TELEMETRY=0 alpine:3.22@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f sh -ec 'apk add --no-cache libstdc++=14.2.0-r6; for args in "--version" "--help" "doctor --json"; do /dist/${{ matrix.smoke }} $args; done'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries-${{ matrix.targets }}
          path: apps/cli/dist/envden-*
          if-no-files-found: error
  image:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Require image namespace
        env:
          NAMESPACE: ${{ vars.ENVDEN_GHCR_NAMESPACE }}
        run: test -n "$NAMESPACE" && ! echo "$NAMESPACE" | grep -qi REPLACE
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: binaries-linux-*-musl
          merge-multiple: true
          path: release
      - id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/server/Dockerfile
          build-contexts: release-artifacts=./release
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=ghcr.io/${{ vars.ENVDEN_GHCR_NAMESPACE }}/envden,push-by-digest=true,name-canonical=true,push=true
  publish:
    if: github.event_name == 'push'
    needs: [build, image]
    permissions:
      contents: write
    uses: ./.github/workflows/sign-feed.yml
    secrets: inherit
    with:
      tag_release: true
      first_release: ${{ vars.ENVDEN_FIRST_RELEASE == '1' }}
  resign:
    if: github.event_name != 'push'
    permissions:
      contents: write
    uses: ./.github/workflows/sign-feed.yml
    secrets: inherit
    with:
      tag_release: false
      first_release: false
  promote-image:
    if: github.event_name == 'push'
    needs: [publish, image]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote signed release image
        env:
          IMAGE: ghcr.io/${{ vars.ENVDEN_GHCR_NAMESPACE }}/envden
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          version=${GITHUB_REF_NAME#v}
          docker buildx imagetools create -t "$IMAGE:$version" -t "$IMAGE:${version%.*}" -t "$IMAGE:${version%%.*}" -t "$IMAGE:latest" "$IMAGE@$DIGEST"

  npm:
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-checksums
          path: npm-release
      - name: Build the npm package from the release checksums
        run: |
          bun --tsconfig-override scripts/tsconfig.json scripts/release/npm-package.ts "${GITHUB_REF_NAME#v}" npm-release/SHA256SUMS npm-release/package
      # trusted publishing: npm exchanges the GitHub OIDC token, so no NPM_TOKEN secret
      - run: npx -y npm@11.21.2 publish ./npm-release/package --access public
