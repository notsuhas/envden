name: Rust
on:
  push:
    branches: [port/rust]
  pull_request:
permissions:
  contents: read
concurrency:
  group: rust-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - run: cargo fmt --all --check
      - if: success() || failure()
        run: cargo clippy --workspace --all-targets -- -D warnings
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - run: cargo test --workspace --no-fail-fast
  windows-check:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - run: rustup target add aarch64-pc-windows-msvc
      - run: cargo check --workspace --all-targets --target aarch64-pc-windows-msvc
  parity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: reference
        run: echo "sha=$(tr -d '[:space:]' < .parity-reference)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.reference.outputs.sha }}
          path: reference
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: reference/package.json
      - run: bun install --frozen-lockfile
        working-directory: reference/apps/cli
      - run: bun run build
        working-directory: reference/apps/cli
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - run: cargo build --release -p envden-cli
      - name: Install pdftotext
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update -q && sudo apt-get install -yq poppler-utils
          else
            brew install poppler
          fi
          pdftotext -v
      - run: bash parity/ci/install-stand-ins.sh
        working-directory: reference
      - run: mkdir -p parity-logs
      - name: Compare binaries
        working-directory: reference
        run: bun parity/run.ts --reference "$PWD/apps/cli/dist/envden" --candidate "$GITHUB_WORKSPACE/target/release/envden" 2>&1 | tee "$GITHUB_WORKSPACE/parity-logs/binaries.log"
      - name: Compare mixed roles
        if: success() || failure()
        working-directory: reference
        run: bun parity/run.ts --reference "$PWD/apps/cli/dist/envden" --candidate "$GITHUB_WORKSPACE/target/release/envden" --mix 2>&1 | tee "$GITHUB_WORKSPACE/parity-logs/mixed.log"
      - name: Compare server transport
        if: success() || failure()
        working-directory: reference
        run: bun parity/transport.ts --reference "$PWD/apps/cli/dist/envden" --candidate "$GITHUB_WORKSPACE/target/release/envden" 2>&1 | tee "$GITHUB_WORKSPACE/parity-logs/transport.log"
      - name: CLI end to end
        if: success() || failure()
        working-directory: reference
        run: bun apps/cli/scripts/e2e.ts "$GITHUB_WORKSPACE/target/release/envden" 2>&1 | tee "$GITHUB_WORKSPACE/parity-logs/e2e.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: parity-logs-${{ matrix.os }}
          path: parity-logs
          if-no-files-found: warn
  host-here:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PARITY_HOST_SHIMS: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: reference
        run: echo "sha=$(tr -d '[:space:]' < .parity-reference)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.reference.outputs.sha }}
          path: reference
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: reference/package.json
      - run: bun install --frozen-lockfile
        working-directory: reference/apps/cli
      - run: bun run build
        working-directory: reference/apps/cli
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - run: cargo build --release -p envden-cli
      - run: bash parity/ci/install-stand-ins.sh
        working-directory: reference
      - run: mkdir -p parity-logs
      - name: Compare host installation
        working-directory: reference
        run: bun parity/run.ts --reference "$PWD/apps/cli/dist/envden" --candidate "$GITHUB_WORKSPACE/target/release/envden" --scenario host-here 2>&1 | tee "$GITHUB_WORKSPACE/parity-logs/host.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: parity-logs-host
          path: parity-logs
          if-no-files-found: warn
