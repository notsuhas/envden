services:
  envden:
    image: ghcr.io/notsuhas/envden:0
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
      - /var/run/tailscale:uid=10001,gid=10001,mode=0700
    healthcheck:
      test:
        [
          CMD-SHELL,
          'wget -q -O /dev/null "http://127.0.0.1:$${ENVDEN_PORT:-4280}/v1/hello?challenge=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" && tailscale status --json | grep -Eq ''"BackendState"[[:space:]]*:[[:space:]]*"Running"''',
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: envden
      ENVDEN_STATUS_PAGE: ${ENVDEN_STATUS_PAGE:-on}
    volumes:
      - envden-data:/data
      - tailscale-state:/var/lib/tailscale
volumes:
  envden-data: {}
  tailscale-state: {}
