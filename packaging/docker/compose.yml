services:
  envden:
    image: ghcr.io/notsuhas/envden:1
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?Set TS_AUTHKEY}
      TS_HOSTNAME: envden
    volumes:
      - envden-data:/data
      - tailscale-state:/var/lib/tailscale
volumes:
  envden-data: {}
  tailscale-state: {}
